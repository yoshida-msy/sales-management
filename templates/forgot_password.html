<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード再設定 - SalesPro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page fade-in">
    <div class="auth-blob one"></div>
    <div class="auth-blob two"></div>

    <div class="auth-card">
        <header class="auth-header">
            <div class="auth-logo">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 class="auth-title">Forgot Password</h1>
            <p class="auth-subtitle">We'll help you get back into your account</p>
        </header>

        <form action="{{ url_for('forgot_password') }}" method="POST">
            <div class="auth-form-group">
                <label class="auth-label">ユーザー名</label>
                <div class="auth-input-wrapper">
                    <i class="fa-solid fa-user auth-input-icon"></i>
                    <input type="text" name="username" class="auth-input" placeholder="Enter your username" required autofocus>
                </div>
            </div>

            <button type="submit" class="btn-auth-primary" style="margin-top: 12px;">
                <span>リセット手順を送信</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

        <footer class="auth-footer">
            <p style="font-size: 0.85rem; color: #a1a1aa; font-weight: 600;">
                <a href="{{ url_for('login') }}" style="color: var(--primary); text-decoration: none; font-weight: 800;"><i class="fa-solid fa-arrow-left"></i> ログイン画面へ戻る</a>
            </p>
        </footer>
    </div>
</body>
</html>
