<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 - SalesPro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page fade-in">
    <div class="auth-blob one"></div>
    <div class="auth-blob two"></div>

    <div class="auth-card">
        <header class="auth-header">
            <div class="auth-logo">
                <i class="fa-solid fa-bolt-lightning"></i>
            </div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join the modern sales platform</p>
        </header>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash-message" style="background: rgba(239, 68, 68, 0.1); color: #fca5a5; border-color: rgba(239, 68, 68, 0.2); padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; font-size: 0.85rem; font-weight: 600; border: 1px solid;">
                <i class="fa-solid fa-circle-exclamation" style="margin-right: 8px;"></i> {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">
            <div class="auth-form-group">
                <label class="auth-label">ユーザー名</label>
                <div class="auth-input-wrapper">
                    <i class="fa-solid fa-user auth-input-icon"></i>
                    <input type="text" name="username" class="auth-input" placeholder="Choose a username" required autofocus>
                </div>
            </div>

            <div class="auth-form-group">
                <label class="auth-label">パスワード</label>
                <div class="auth-input-wrapper">
                    <i class="fa-solid fa-lock auth-input-icon"></i>
                    <input type="password" name="password" class="auth-input" placeholder="Create a password" required>
                </div>
            </div>

            <div class="auth-form-group">
                <label class="auth-label">パスワード (確認)</label>
                <div class="auth-input-wrapper">
                    <i class="fa-solid fa-shield-check auth-input-icon"></i>
                    <input type="password" name="confirm_password" class="auth-input" placeholder="Confirm your password" required>
                </div>
            </div>

            <button type="submit" class="btn-auth-primary" style="margin-top: 12px;">
                <span>アカウントを作成</span>
                <i class="fa-solid fa-user-plus"></i>
            </button>
        </form>

        <footer class="auth-footer">
            <p style="font-size: 0.85rem; color: #a1a1aa; font-weight: 600;">
                既にアカウントをお持ちですか？ <a href="{{ url_for('login') }}" style="color: var(--primary); text-decoration: none; font-weight: 800;">ログイン</a>
            </p>
        </footer>
    </div>
</body>
</html>
