{% extends "base.html" %}
{% block title %}<h1>商品情報の編集</h1>{% endblock %}
{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card-section">
        <div class="section-header"><h2>商品ID: #{{ product.id }}</h2></div>
        <div style="padding: 32px;">
            <form method="POST">
                <div class="form-group">
                    <label>商品名</label>
                    <input type="text" name="name" value="{{ product.name }}" required>
                </div>
                <div class="form-group">
                    <label>単価 (円)</label>
                    <input type="number" name="price" value="{{ product.price }}" required min="0">
                </div>
                <div class="form-group">
                    <label>在庫数</label>
                    <input type="number" name="stock" value="{{ product.stock }}" required min="0">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">変更を保存</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
