{% extends "base.html" %}

{% block title %}<h1>商品管理</h1>{% endblock %}

{% block content %}
<div class="stats-grid" style="grid-template-columns: 1fr 2fr;">
    <!-- 新規商品登録 -->
    <div class="card-section">
        <div class="section-header"><h2><i class="fa-solid fa-plus-circle"></i> 新規登録</h2></div>
        <div style="padding: 24px;">
            <form action="{{ url_for('products') }}" method="POST">
                <div class="form-group">
                    <label>商品名</label>
                    <input type="text" name="name" required placeholder="例: モニター">
                </div>
                <div class="form-group">
                    <label>単価 (円)</label>
                    <input type="number" name="price" required min="0">
                </div>
                <div class="form-group">
                    <label>初期在庫</label>
                    <input type="number" name="stock" required min="0">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">登録する</button>
            </form>
        </div>
    </div>

    <!-- 商品一覧 -->
    <div class="card-section">
        <div class="section-header">
            <h2>在庫一覧</h2>
            <form method="GET" style="display: flex; gap: 8px;">
                <input type="text" name="q" value="{{ q }}" placeholder="商品名検索..." style="width: 180px;">
                <button type="submit" class="btn-secondary small"><i class="fa-solid fa-search"></i></button>
            </form>
        </div>
        <table>
            <thead>
                <tr><th>商品名</th><th>単価</th><th>在庫</th><th>操作</th></tr>
            </thead>
            <tbody>
                {% for p in products %}
                <tr>
                    <td class="font-bold">{{ p.name }}</td>
                    <td>{{ "{:,}".format(p.price) }}</td>
                    <td class="{{ 'text-danger font-bold' if p.stock < 5 }}">
                        {% if p.stock < 5 %}<i class="fa-solid fa-triangle-exclamation"></i> {% endif %}
                        {{ p.stock }}
                    </td>
                    <td>
                        <div style="display: flex; gap: 8px;">
                            <a href="{{ url_for('edit_product', id=p.id) }}" class="btn-action edit"><i class="fa-solid fa-pen"></i></a>
                            <form action="{{ url_for('delete_product', id=p.id) }}" method="POST" onsubmit="return confirm('削除しますか？')">
                                <button type="submit" class="btn-action delete"><i class="fa-solid fa-trash"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
