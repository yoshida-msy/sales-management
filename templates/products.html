{% extends "base.html" %}

{% block title %}
<h1>商品管理</h1>
{% endblock %}

{% block content %}
<div class="stats-grid" style="grid-template-columns: 1fr 2fr;">
    <!-- 新規登録 -->
    <section class="card-section">
        <div class="section-header">
            <h2><i class="fa-solid fa-square-plus"></i> 新規商品登録</h2>
        </div>
        <div style="padding: 24px;">
            <form method="POST">
                <div class="form-group">
                    <label>商品名</label>
                    <input type="text" name="name" required placeholder="商品名を入力">
                </div>
                <div class="form-group">
                    <label>単価 (円)</label>
                    <input type="number" name="price" required min="0">
                </div>
                <div class="form-group">
                    <label>初期在庫</label>
                    <input type="number" name="stock" required min="0">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">
                    <i class="fa-solid fa-save"></i> 登録する
                </button>
            </form>
        </div>
    </section>

    <!-- 商品一覧 & 検索 -->
    <section class="card-section">
        <div class="section-header">
            <h2><i class="fa-solid fa-boxes-stacked"></i> 在庫一覧</h2>
            <form method="GET" style="display: flex; gap: 8px;">
                <input type="text" name="q" value="{{ q }}" placeholder="商品名検索..." style="padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 6px;">
                <button type="submit" class="btn-primary" style="padding: 6px 12px;"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>
        </div>
        <table>
            <thead>
                <tr>
                    <th>商品名</th>
                    <th>単価</th>
                    <th>在庫数</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {% for product in products %}
                <tr class="{{ 'low-stock-row' if product.stock < 5 else '' }}">
                    <td style="font-weight: 500;">{{ product.name }}</td>
                    <td>{{ "{:,}".format(product.price) }}</td>
                    <td style="font-weight: 600;">
                        {{ product.stock }}
                        {% if product.stock < 5 %}
                        <span style="color: var(--danger); font-size: 0.75rem; margin-left: 4px;"><i class="fa-solid fa-warning"></i> 不足</span>
                        {% endif %}
                    </td>
                    <td style="display: flex; gap: 8px;">
                        <a href="{{ url_for('edit_product', id=product.id) }}" class="btn-action edit"><i class="fa-solid fa-pen-to-square"></i></a>
                        <form action="{{ url_for('delete_product', id=product.id) }}" method="POST" onsubmit="return confirm('本当に削除しますか？');">
                            <button type="submit" class="btn-action delete"><i class="fa-solid fa-trash"></i></button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </section>
</div>
{% endblock %}
