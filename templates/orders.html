{% extends "base.html" %}

{% block title %}<h1>受注・請求管理</h1>{% endblock %}

{% block content %}
<div class="card-section">
    <div class="section-header">
        <h2>受注履歴一覧</h2>
        <div style="display: flex; gap: 12px;">
            <a href="{{ url_for('add_order') }}" class="btn-primary"><i class="fa-solid fa-plus"></i> 新規受注登録</a>
        </div>
    </div>
    
    <!-- 検索フィルタ -->
    <div style="padding: 24px; border-bottom: 1px solid var(--border);">
        <form method="GET" style="display: flex; gap: 16px; align-items: flex-end;">
            <div style="flex: 1;">
                <label style="display: block; font-size: 0.75rem; margin-bottom: 4px;">商品名検索</label>
                <input type="text" name="q" value="{{ q }}" placeholder="商品名を入力...">
            </div>
            <div style="width: 200px;">
                <label style="display: block; font-size: 0.75rem; margin-bottom: 4px;">ステータス</label>
                <select name="status">
                    <option value="">すべて</option>
                    {% for s in ["未請求", "請求済", "入金済", "キャンセル"] %}
                    <option value="{{ s }}" {{ 'selected' if status_filter == s }}>{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn-secondary">検索実行</button>
        </form>
    </div>

    <table>
        <thead>
            <tr><th>日時</th><th>商品名</th><th>数量</th><th>合計</th><th>状態</th><th>操作</th></tr>
        </thead>
        <tbody>
            {% for o in orders %}
            <tr>
                <td class="text-muted">{{ o.order_date[:16] }}</td>
                <td class="font-bold">{{ o.name }}</td>
                <td>{{ o.quantity }}</td>
                <td class="font-bold">{{ "{:,}".format(o.total_price) }}</td>
                <td><span class="badge status-{{ o.status }}">{{ o.status }}</span></td>
                <td>
                    <form action="{{ url_for('update_status', id=o.id) }}" method="POST" style="display: flex; gap: 4px;">
                        <select name="status" style="padding: 4px; font-size: 0.8rem; width: 100px;">
                            {% for s in ["未請求", "請求済", "入金済", "キャンセル"] %}
                            <option value="{{ s }}" {{ 'selected' if o.status == s }}>{{ s }}</option>
                            {% endfor %}
                        </select>
                        <button type="submit" class="btn-secondary small">更新</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
