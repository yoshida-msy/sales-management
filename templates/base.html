<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>販売管理ツール</title>
    <!-- static/css/style.css を読み込む -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <div class="container">
                <a href="{{ url_for('index') }}" class="logo">販売管理ミニツール</a>
                <ul>
                    <li><a href="{{ url_for('index') }}">ダッシュボード</a></li>
                    <li><a href="{{ url_for('products') }}">商品管理</a></li>
                    <li><a href="{{ url_for('orders') }}">受注一覧</a></li>
                    <li><a href="{{ url_for('add_order') }}">受注登録</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container">
        <!-- flashメッセージ（成功やエラーの通知）を表示 -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Sales Tool Prototype</p>
        </div>
    </footer>
</body>
</html>
