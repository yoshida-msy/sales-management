<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>販売管理システム Pro</title>
    <!-- モダンなフォントの読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome (アイコン) の読み込み -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 独自CSSの読み込み -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- サイドバー -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-chart-line logo-icon"></i>
                <span class="logo-text">SalesPro</span>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="{{ 'active' if request.path == url_for('index') }}">
                        <a href="{{ url_for('index') }}">
                            <i class="fa-solid fa-house"></i> ダッシュボード
                        </a>
                    </li>
                    <li class="{{ 'active' if request.path == url_for('products') }}">
                        <a href="{{ url_for('products') }}">
                            <i class="fa-solid fa-box"></i> 商品管理
                        </a>
                    </li>
                    <li class="{{ 'active' if request.path == url_for('orders') }}">
                        <a href="{{ url_for('orders') }}">
                            <i class="fa-solid fa-file-invoice-dollar"></i> 受注・請求管理
                        </a>
                    </li>
                    <li class="{{ 'active' if request.path == url_for('add_order') }}">
                        <a href="{{ url_for('add_order') }}">
                            <i class="fa-solid fa-cart-plus"></i> 新規受注登録
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <p>&copy; 2026 SalesPro v1.0</p>
            </div>
        </aside>

        <!-- メインコンテンツエリア -->
        <div class="main-wrapper">
            <header class="top-bar">
                <div class="page-title">
                    {% block title %}{% endblock %}
                </div>
                <div class="user-info">
                    <i class="fa-solid fa-circle-user"></i> 管理者ユーザー
                </div>
            </header>

            <main class="content">
                <!-- 通知メッセージ (Flash) -->
                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    {% for message in messages %}
                      <div class="flash-message">
                          <i class="fa-solid fa-circle-check"></i> {{ message }}
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
