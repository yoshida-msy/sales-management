<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - SalesPro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page fade-in">
    <!-- Animated Background Blobs -->
    <div class="auth-blob one"></div>
    <div class="auth-blob two"></div>

    <div class="auth-card">
        <header class="auth-header">
            <div class="auth-logo">
                <i class="fa-solid fa-bolt-lightning"></i>
            </div>
            <h1 class="auth-title">SalesPro</h1>
            <p class="auth-subtitle">Modern Sales Intelligence Platform</p>
        </header>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash-message" style="background: rgba(239, 68, 68, 0.1); color: #fca5a5; border-color: rgba(239, 68, 68, 0.2); padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; font-size: 0.85rem; font-weight: 600; border: 1px solid;">
                <i class="fa-solid fa-circle-exclamation" style="margin-right: 8px;"></i> {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="auth-form-group">
                <label class="auth-label">ユーザー名</label>
                <div class="auth-input-wrapper">
                    <i class="fa-solid fa-user auth-input-icon"></i>
                    <input type="text" name="username" class="auth-input" placeholder="Enter your username" required autofocus>
                </div>
            </div>

            <div class="auth-form-group">
                <label class="auth-label">パスワード</label>
                <div class="auth-input-wrapper">
                    <i class="fa-solid fa-lock auth-input-icon"></i>
                    <input type="password" name="password" class="auth-input" placeholder="••••••••" required>
                </div>
            </div>

            <div style="margin-bottom: 32px; display: flex; justify-content: space-between; align-items: center;">
                <label style="display: flex; align-items: center; gap: 8px; color: #a1a1aa; font-size: 0.85rem; cursor: pointer;">
                    <input type="checkbox" style="accent-color: var(--primary); width: 16px; height: 16px;"> ログイン状態を保持
                </label>
                <a href="#" style="color: var(--primary); font-size: 0.85rem; font-weight: 700; text-decoration: none;">パスワードを忘れた方</a>
            </div>

            <button type="submit" class="btn-auth-primary">
                <span>サインイン</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <footer class="auth-footer">
            <p style="font-size: 0.8rem; color: #71717a; font-weight: 600;">
                <i class="fa-solid fa-shield-halved" style="margin-right: 6px;"></i> Enterprise Secure Authentication
            </p>
            <div style="margin-top: 16px; font-size: 0.75rem; color: #52525b;">
                デモアカウント: <code style="background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; color: #a1a1aa;">admin / password</code>
            </div>
        </footer>
    </div>
</body>
</html>
