<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - SalesPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fa-solid fa-rocket logo-icon" style="font-size: 3rem;"></i>
                <h1>SalesPro</h1>
                <p class="text-muted">業務管理システムにログイン</p>
            </div>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div class="flash-message" style="background: #fef2f2; color: #991b1b; border-color: #fecaca;">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                    <label>ユーザー名</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>パスワード</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 14px; font-size: 1rem;">
                    ログイン
                </button>
            </form>
            
            <div style="margin-top: 24px; text-align: center; font-size: 0.875rem;" class="text-muted">
                <p>デモ用: admin / password</p>
            </div>
        </div>
    </div>
</body>
</html>
